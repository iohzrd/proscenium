name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # The release workflow runs these jobs before it builds.
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: Prettier check
        run: npx prettier --plugin prettier-plugin-svelte --check "src/**/*.{ts,svelte}"

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: 'server -> target'

      - name: Check formatting
        run: cargo fmt --manifest-path server/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path server/Cargo.toml --locked

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit client dependencies
        run: cargo audit --file Cargo.lock

      - name: Audit server dependencies
        run: cargo audit --file server/Cargo.lock
