[package]
name = "proscenium"
version.workspace = true
description = "P2P social media on iroh"
authors = ["iohzrd"]
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proscenium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aec3 = "0.4"
base64 = "0.23"
bip39 = { version = "3", features = ["zeroize"] }
bytes = "1"
cpal = "0.18.1"
futures-lite = "2"
getrandom = "0.4.1"
hex = "0.4.3"
iroh = "1.4.1"
iroh-blobs = { version = "0.104", features = ["fs-store"] }
iroh-gossip = { workspace = true }
iroh-mainline-address-lookup = "0.6"
iroh-mdns-address-lookup = "0.6"
log = "0.4"
mime_guess = "2.0.5"
opus = "0.4"
png = "0.18.1"
proscenium-types = { path = "../crates/proscenium-types" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
ringbuf = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
subtle = "2.6.1"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
urlencoding = "2"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1"
webpki-root-certs = "1.0.12"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-haptics = "2"

[dev-dependencies]
# Mock runtime (`tauri::test::mock_app`) for tests of functions that take an `AppHandle`.
tauri = { version = "2.11", features = ["test"] }
