# cargo-audit configuration, read when cargo audit runs from the repository root.

[advisories]
# RUSTSEC-2026-0459: SQLite before 3.54.0 (libsqlite3-sys < 0.39) can return uninitialized
# page-cache memory for a database opened next to a crafted -wal file with another page
# size. sqlx-sqlite 0.9.0, the newest release, requires libsqlite3-sys < 0.38, so no
# patched version can be selected. The client and the server open only the database files
# they create in their own data directory. Remove this entry once sqlx accepts
# libsqlite3-sys >= 0.39.
ignore = ["RUSTSEC-2026-0459"]
