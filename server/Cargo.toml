[package]
name = "proscenium-server"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "proscenium-server"
path = "src/main.rs"

[dependencies]
proscenium-types = { path = "../crates/proscenium-types" }
iroh = "1.4.1"
iroh-gossip = "0.102.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["cors", "set-header", "timeout", "trace"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-lite = "2"
getrandom = "0.4"
maud = { version = "0.27", features = ["axum"] }
url = "2.5.8"

# iroh-gossip 0.102.0 with the read_lp allocation fix and the per-connection frame storage
# limit, `Builder::max_recv_buffer` (ef8fac7 on the fork's branch recv-buffer-limit-0.102);
# remove once a release contains both.
[patch.crates-io]
iroh-gossip = { git = "https://github.com/iohzrd/iroh-gossip", rev = "ef8fac735fafbf7b98ac49da7dcdb6c44f09e588" }
