[workspace]
resolver = "3"
members = ["crates/proscenium-types", "src-tauri"]
exclude = ["server"]

[workspace.package]
edition = "2024"
version = "0.2.51"

[workspace.dependencies]
iroh-gossip = "0.102.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"

# iroh-gossip 0.102.0 with the read_lp allocation fix (fb253e0 on the fork's branch
# read-lp-allocation-0.102); remove once a release contains it.
[patch.crates-io]
iroh-gossip = { git = "https://github.com/iohzrd/iroh-gossip", rev = "fb253e0cd604829fc734a77a95b03c80f968d9cd" }
